name: E2E Required Check Compatibility

on:
  pull_request:
  push:
    branches:
      - dev

# The retired E2E workflow remains a required check on dev until the .asf.yaml change in this PR
# is merged and synchronized to GitHub branch protection. Remove this compatibility workflow after
# that synchronization completes.
jobs:
  result:
    name: E2E - Result
    runs-on: ubuntu-latest
    steps:
      - name: Report retired E2E status
        run: echo "The legacy E2E suite is retired for the StreamPark 3.0 architecture transition."
